name: Build SafeExamBrowser

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64]
        configuration: [Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: 'latest'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore SafeExamBrowser.sln

    - name: Build SafeExamBrowser Solution
      run: |
        msbuild SafeExamBrowser.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /verbosity:minimal /m

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SafeExamBrowser-${{ matrix.platform }}-${{ matrix.configuration }}
        path: |
          SafeExamBrowser.Client/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
          SafeExamBrowser.Runtime/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
          SebWindowsConfig/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
          SafeExamBrowser.ResetUtility/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
          SafeExamBrowser.Service/bin/${{ matrix.platform }}/${{ matrix.configuration }}/**
